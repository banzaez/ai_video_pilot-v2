# Конфигурация AI Video Pilot
# Приоритет: CLI-аргументы > этот YAML > значения по умолчанию в коде
#
# Пайплайн:
#   info → detect → tracklets → pose → feet → tracklet_reid → tracklet_link → track
#
# Склейка кусков ByteTrack — стадия tracklet_link (tracklet_pipeline.link → tracklet_links.json).
# Вкладка «Склейки» читает эти группы, отдельной стадии link нет.

# ./venv/bin/python3 -m app.main --input session:024_20260817 --from tracklets --to track

pipeline:
  # all / no_merge = detect→feet (no_merge — алиас all)
  stage: "all"

video:
  # Папка prod-роликов (sessions) или один файл / session:01_20260601
  # Dev-lite только вручную: data/video/lite/foo.mp4
  input_path: "data/video"
  # Корень артефактов: data/results/{session_key}/ или data/results/{stem}/ (legacy)
  json_output_dir: "data/results"
  # Число процессов детекции. На MPS принудительно 1 (одна GPU)
  workers: 1

# Папка с весами Stage 1 (detect). Имена в detection.models — относительно неё.
models_dir: data/models/detect
# Папка с весами ReID (SOLIDER) — общая для tracklet_reid
reid_models_dir: data/models/reid

# --- Отбор лучших кадров (TrackBestFramesPicker) ---
# Интеллектуальный отбор качественных кадров по скелету и чистоте от посторонних людей.
# Используется в Stage 2b (ReID треклетов) и Stage Face / camera_link (извлечение лиц InsightFace).
best_frames:
  # Вес оценки скелета/позы человека в итоговом скоре кадра (0.0..1.0).
  # 0.0 = только геометрия и площадь bbox; 0.40 = приоритет развернутому телу с полным набором ключевых точек
  pose_weight: 0.40
  # Штраф за присутствие посторонних людей в кадре/кропе (0.0..1.0).
  # Множитель итогового скора, если в зоне кропа обнаружены чужие ключевые точки или перекрытия
  crowd_penalty: 0.50
  # Минимальная уверенность (confidence) ключевой точки скелета, чтобы считать её видимой (порог полноты)
  min_completeness: 0.20
  # Отступ (padding) вокруг bbox при формировании кропа человека (доля от размера)
  pad: 0.00
  # Мягкое гауссово затухание краев кропа на основе позы / силуэта человека (Alpha / Gaussian Feathering)
  feathering:
    enabled: false # Включение гауссова затухания краев кропа
    mode: "pose" # "pose" (анатомический силуэт по скелету) или "ellipse" (радиальный фокус)
    sigma: 12.0 # Радиус мягкого размытия границы
    bone_thickness: 0.18 # Толщина костей скелета относительно ширины кропа (доля 0.05..0.40)
    bg_color: [128, 128, 128] # Нейтральный цвет фона для блендинга [R, G, B]

  # --- Многоуровневая фильтрация краевых и аномальных кадров трека ---
  # 1. Временной тримминг краев (защита от ошибок рождения/смерти трека)
  trim:
    enabled: true
    start_frames: 2 # Исключать первые N кадров трека
    end_frames: 2 # Исключать последние N кадров трека
    min_track_len: 8 # Применять только если трек длится >= N кадров

  # 2. Кинематический фильтр пространственных скачков BBox
  kinematic:
    enabled: true
    max_speed_ratio: 3.0 # Макс. превышение медианной скорости перемещения центра BBox
    max_area_ratio: 2.2 # Макс. допустимый скачок площади BBox

  # 3. Фильтр согласованности цвета одежды (HSV-гистограмма)
  color_consistency:
    enabled: true
    min_similarity: 0.55 # Порог сходства цвета верхней части тела с медианой трека (0..1)

reid:
  device: mps
  batch_size: 8
  solider_weights: solider_swin_base_msmt17.pth
  solider_semantic_weight: 0.2
  solider_image_size: [256, 128]
  solider_transformer: swin_base_patch4_window7_224

# --- Stage 1: detect → detections.json ---
detection:
  # yolo | rtdetr | rtdetr_v2
  # rtdetr: Ultralytics RT-DETR v1 (rtdetr-l.pt / rtdetr-x.pt)
  # rtdetr_v2: Hugging Face RT-DETRv2 (PekingU/rtdetr_v2_*), pip install transformers
  backend: yolo
  # Порог уверенности детекции (0..1). Ниже — больше боксов, выше — чище, но можно пропустить людей
  conf: 0.25
  # NMS IoU похожих боксов. Вложенные (торс в полном росте) — IoS; широкий бокс на двоих выкидывается
  iou: 0.5
  # Каждый N-й кадр (1 = все). Трекер получает только эти наблюдения; fps видео ему не нужен.
  detect_every_n: 1
  # Устройство инференса: mps | cuda | cpu | auto
  device: "auto"

  # Классы COCO для фильтрации: 0 = person
  classes: [0]
  # Точность инференса: 16/fp16 = FP16, null/32 = FP32 (на CPU всегда FP32)
  quantize: 16
  # Кадров за predict на Stage 1. RT-DETR обычно 16, YOLO можно 32+
  batch_size: 32
  # Размер входа (px по длинной стороне)
  imgsz: 1280
  # Веса по backend. yolo/rtdetr — файлы в models_dir; rtdetr_v2 — HF id или локальная папка
  models:
    yolo: yolo26m.pt
    rtdetr: rtdetr-l.pt
    rtdetr_v2: PekingU/rtdetr_v2_r50vd

# --- Stage 2: tracklets → pose → feet → ReID → link ---
tracklet_pipeline:
  tracker:
    # bytetrack | botsort | ocsort | deepocsort | fasttrack | tracktrack
    type: tracktrack
    # Conf ≥ этого → первый матч. Детекции уже ≥0.35; 0.40 = типичный человек в high, слабые — во второй проход.
    track_high_thresh: 0.30
    # low < conf < high: только продлевают живой трек, новый ID не заводят.
    track_low_thresh: 0.25
    # Мин. conf нового ID + TAI-NMS. Выше 0.25 (OC-SORT) — меньше дублей вроде #1+#72; 0.70 дефолт TrackTrack режет слабых.
    new_track_thresh: 0.35
    # Шагов помнить lost. 30 (дефолт TT) ≈ 3.6 с при every_n=3 — чужой ID. 12 ≈ 1.4 с: дыры да, длинные окклюзии нет.
    track_buffer: 30
    # COST, не IoU: матч если cost < порога. 0.85 от OC-SORT здесь НАОБОРОТ слабее (склеивает лишнее).
    # Дефолт TT 0.7; 0.55 строже — меньше ID-switch при пересечениях.
    match_thresh: 0.45
    # Ослабленный rebind lost. 0 = выкл. Иначе lost легко садится на соседнего человека.
    lost_match_thr: 0.0
    # --- Веса многофакторной матрицы стоимости (Cost Matrix) ---
    # cost = iou_weight·HMIoU + reid_weight·Cosine(ReID) + conf_weight·Δconf + angle_weight·Δangle
    # Вес пространственного расстояния (IoU / HMIoU). При активном ReID обычно 0.50
    iou_weight: 0.40
    # Вес расстояния по внешности (ReID). Влияние сходства эмбеддингов людей при матче (0.20-0.35)
    reid_weight: 0.35
    # Вес разницы в confidence детекций (0.05-0.15)
    conf_weight: 0.10
    # Вес расхождения направления движения (защита от склеивания встречных людей)
    angle_weight: 0.15

    # --- Штрафы и шаги итеративной ассоциации ---
    # Штраф к cost для детекций второго прохода (low_thresh < conf < high_thresh)
    penalty_p: 0.25
    # Штраф к cost для восстановленных/интерполированных детекций
    penalty_q: 0.40
    # Шаг снижения порога стоимости при итеративном жадном сопоставлении
    reduce_step: 0.05

    # TAI (Track-Aware IoU): порог NMS против создания дублирующего трека поверх уже живого. Ниже = строже.
    tai_thr: 0.55
    # Минимальная длина трека (в кадрах) для подтверждения
    min_track_len: 4

    # --- ReID модуль трекера ---
    # with_reid: true считывает кадры видео и использует сходство внешности при сопоставлении боксов
    with_reid: true
    # Модель ReID для трекера (yolo26n-reid.onnx в data/models/reid/ или путь к весам)
    model: yolo26s-reid.onnx

  # Stage pose: YOLO-pose на кадрах треклетов → poses.json
  pose:
    model: yolo26s-pose.pt
    conf: 0.55
    kpt_min: 0.25

  # Stage feet: проекция ног треклетов на план → feet.json + координаты в tracklets.json
  feet:
    torso_height_m: 0.0
    person_height_m: 1.70
    smooth_window: 10
    max_speed_mps: 2.0

  # Stage 2b: эмбеддинги кропов треклетов (tracklet_reid.json + .npz)
  reid:
    top_k: 5
    pick: spread
    batch_size: 8
    # JPG на диск не нужны для 2c (эмбеддинги в npz). true — только для отладки
    save_crops: false
    crops_dir: tracklet_crops

  # Stage 2c tracklet_link → tracklet_links.json (вкладка «Склейки»)
  # Склейка: Pass 0 (ReID + combo score).
  link:
    # Кандидаты A→B и фильтры до combo.
    candidates:
      # Макс. пауза между концом A и началом B, сек. Дальше ребро не строится.
      max_gap_sec: 40.0
      # Макс. допустимое наложение (overlap) треклетов по времени, сек.
      max_overlap_sec: 2.0
      # Мин. ReID (max pairwise по кропам). Ниже — пара отбрасывается ещё до combo.
      min_reid_score: 0.90
    # Веса combo = w_reid·reid + w_gap·gap (сумма = 1).
    combo:
      w_reid: 0.85
      w_gap: 0.15

    # Pass 0: склейка по ReID и combo score.
    pass0:
      min_reid: 0.96
      min_score: 0.75

    # Pass Alone Geo (Pass 1): склейка одиночного человека по геометрии (трек пропал и появился, вокруг никого не было)
    pass_alone_geo:
      enabled: true
      radius_m: 2.0 # Радиус проверки изоляции (метры на плане этажа)
      max_gap_sec: 10.0 # Макс. пауза между концом A и началом B, сек
      max_dist_m: 3.0 # Макс. расстояние между точкой конца A и начала B, метры
      max_speed_mps: 2.0 # Макс. скорость перемещения между точками, м/с
      min_reid: 0.90 # Мин. ReID (0.0 — чисто геометрический матчинг)

# --- Stage track: ремап треклетов → tracking.json / tracks.json ---
tracker_filters:
  # Мин. площадь bbox (медиана по треку, px²). ~50×50=2500 — отсекает «точки»
  min_bbox_area: 2500
  # Выкинуть трек, если обе стороны bbox (медиана W и H) < этого, px
  min_bbox_side: 40
  # Мин. длина трека в секундах (последний−первый кадр). Короче — выкинуть
  min_track_sec: 0

# --- Stage day_link: глобальная межкамерная склейка дня (Pass 0: Alone Geo, Pass 1: ReID >= 0.96) ---
day_link:
  enabled: true
  candidates:
    max_gap_sec: 300
  pass0:
    enabled: true
    radius_m: 2.0
    min_overlap_sec: 5.0
    max_gap_sec: 10.0
    max_dist_m: 3.0
    max_speed_mps: 2.5
    min_reid: 0.90
  pass1:
    enabled: true
    min_reid: 0.96
    max_gap_sec: 300.0

nvr:
  enabled: true
  host: "183.88.220.86"
  port: 8003
  track_ids:
    - "1501"
    - "1401"
  track_camera_map: {}
  search_lookback_hours: 24
  connect_timeout_sec: 30
  read_timeout_search_sec: 120
  read_timeout_download_sec: 900
